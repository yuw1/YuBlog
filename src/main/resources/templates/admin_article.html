<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('文章管理')}"></head>
<body>
<div th:replace="~{fragments :: topbar('admin')}"></div>

<main class="shell">
    <div class="page-head">
        <div>
            <h1>文章管理</h1>
            <p>删除文章会连同它的评论一起删掉。</p>
        </div>
        <span class="badge badge--accent" th:text="${#lists.size(articles)} + ' 篇'">0 篇</span>
    </div>

    <div class="layout">
        <aside class="sidebar">
            <th:block th:replace="~{fragments :: adminNav('article')}"></th:block>
        </aside>

        <section>
            <div class="table-wrap">
                <table class="table">
                    <thead>
                    <tr>
                        <th>标题</th>
                        <th>摘要</th>
                        <th>作者</th>
                        <th>目录</th>
                        <th>最后修改</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="article : ${articles}">
                        <td><a class="truncate" style="display:block;max-width:240px"
                               th:href="@{/article(articleId=${article.id})}" th:text="${article.title}">标题</a></td>
                        <td><span class="truncate" style="display:block"
                                  th:text="${article.articleAbstract}">摘要</span></td>
                        <td th:text="${article.authorUsername}">alice</td>
                        <td><span class="badge" th:text="${article.catalogName}">分类</span></td>
                        <td class="mono dim" th:text="${article.lastModifiedText}">2026-01-01 00:00</td>
                        <td class="cell-actions">
                            <a class="btn btn--sm" th:href="@{/article(articleId=${article.id})}">查看</a>
                            <form action="/admin-delete-article-by-id" method="post"
                                  onsubmit="return confirm('删除后不可恢复，确定？');">
                                <input type="hidden" name="article-id" th:value="${article.id}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn--sm btn--danger" type="submit">删除</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${#lists.isEmpty(articles)}" style="border:0">还没有文章</div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
