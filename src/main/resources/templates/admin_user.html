<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('博客管理')}"></head>
<body>
<div th:replace="~{fragments :: topbar('admin')}"></div>

<main class="shell">
    <div class="page-head">
        <div>
            <h1>博客管理</h1>
            <p>普通用户、文章、评论、封禁与目录。</p>
        </div>
        <span class="badge badge--accent" th:text="${#lists.size(commonUsers)} + ' 位普通用户'">0 位</span>
    </div>

    <div class="layout">
        <aside class="sidebar">
            <th:block th:replace="~{fragments :: adminNav('user')}"></th:block>
            <div class="card">
                <div class="card__body">
                    <div class="sidebar__title">说明</div>
                    <p class="soft" style="font-size:13px">
                        只有 ROLE_USER 的账号才会出现在这里；管理员和站长不会重复列出。
                    </p>
                </div>
            </div>
        </aside>

        <section>
            <div class="table-wrap">
                <table class="table">
                    <thead>
                    <tr>
                        <th>头像</th>
                        <th>ID</th>
                        <th>用户名</th>
                        <th>主页</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${commonUsers}">
                        <td><img class="avatar" th:src="${u.userPic}" alt=""></td>
                        <td class="mono" th:text="${u.id}">1</td>
                        <td th:text="${u.username}">alice</td>
                        <td><a class="btn btn--sm" th:href="@{/user(userId=${u.id})}">查看</a></td>
                        <td class="cell-actions">
                            <form action="/admin-disable-user" method="post"
                                  onsubmit="return confirm('封禁后该用户将无法登录，确定？');">
                                <input type="hidden" name="user-id" th:value="${u.id}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn--sm btn--danger" type="submit">封禁</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${#lists.isEmpty(commonUsers)}" style="border:0">没有普通用户</div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
