<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('目录管理')}"></head>
<body>
<div th:replace="~{fragments :: topbar('admin')}"></div>

<main class="shell">
    <div class="page-head">
        <div>
            <h1>目录管理</h1>
            <p>重命名会同步更新文章里的分类名；有子目录或文章的分类不能直接删除。</p>
        </div>
        <span class="badge badge--accent" th:text="${#lists.size(catalogs)} + ' 个分类'">0 个</span>
    </div>

    <div class="layout">
        <aside class="sidebar">
            <th:block th:replace="~{fragments :: adminNav('catalog')}"></th:block>

            <div class="card">
                <div class="card__head">
                    <h2 class="card__title">目录结构</h2>
                </div>
                <div class="card__body">
                    <nav class="cat-tree" aria-label="目录结构">
                        <th:block th:if="${catalogRoot != null and catalogRoot.id != 0}">
                            <th:block th:replace="~{fragments :: catPlain(${catalogRoot})}"></th:block>
                        </th:block>
                        <span class="dim" th:if="${catalogRoot == null or catalogRoot.id == 0}">还没有分类</span>
                    </nav>
                </div>
            </div>
        </aside>

        <section>
            <div class="table-wrap">
                <table class="table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>名称</th>
                        <th>增加子目录</th>
                        <th>重命名</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="catalog : ${catalogs}">
                        <td class="mono" th:text="${catalog.id}">1</td>
                        <td th:text="${catalog.name}">技术</td>
                        <td>
                            <form class="inline-form" action="/admin-add-catalog" method="post">
                                <input type="hidden" name="parent-catalog-id" th:value="${catalog.id}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input class="input" type="text" name="sub-catalog-name" placeholder="子目录名称"
                                       maxlength="50" required>
                                <button class="btn btn--sm" type="submit">添加</button>
                            </form>
                        </td>
                        <td>
                            <form class="inline-form" action="/admin-rename-catalog" method="post">
                                <input type="hidden" name="catalog-id" th:value="${catalog.id}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input class="input" type="text" name="catalog-name"
                                       th:value="${catalog.name}" maxlength="50" required>
                                <button class="btn btn--sm" type="submit">重命名</button>
                            </form>
                        </td>
                        <td class="cell-actions">
                            <form th:if="${catalog.subCatalogs == null or #lists.isEmpty(catalog.subCatalogs)}"
                                  action="/admin-delete-catalog-by-id" method="post"
                                  onsubmit="return confirm('删除这个分类？');">
                                <input type="hidden" name="catalog-id" th:value="${catalog.id}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn--sm btn--danger" type="submit">删除</button>
                            </form>
                            <span class="badge" th:unless="${catalog.subCatalogs == null or #lists.isEmpty(catalog.subCatalogs)}">
                                有子目录
                            </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${#lists.isEmpty(catalogs)}" style="border:0">还没有分类</div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
