<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('管理员申请')}"></head>
<body>
<div th:replace="~{fragments :: topbar('owner')}"></div>

<main class="shell">
    <div class="page-head">
        <div>
            <h1>管理员申请</h1>
            <p>同意后该账号立即获得管理员权限。</p>
        </div>
        <span class="badge badge--accent" th:text="${#lists.size(adminApplies)} + ' 条申请'">0 条</span>
    </div>

    <div class="layout">
        <aside class="sidebar">
            <th:block th:replace="~{fragments :: ownerNav('request')}"></th:block>
        </aside>

        <section>
            <div class="table-wrap">
                <table class="table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>用户名</th>
                        <th>申请时间</th>
                        <th>主页</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="apply : ${adminApplies}">
                        <td class="mono" th:text="${apply.userId}">1</td>
                        <td th:text="${apply.userName}">alice</td>
                        <td class="mono dim" th:text="${apply.lastApplyTimeText}">2026-01-01 00:00</td>
                        <td><a class="btn btn--sm" th:href="@{/user(userId=${apply.userId})}">查看</a></td>
                        <td class="cell-actions">
                            <form action="/owner-passAdminApply" method="post">
                                <input type="hidden" name="user-id" th:value="${apply.userId}">
                                <input type="hidden" name="passAdminApply" value="true">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn--sm btn--primary" type="submit">同意</button>
                            </form>
                            <form action="/owner-passAdminApply" method="post">
                                <input type="hidden" name="user-id" th:value="${apply.userId}">
                                <input type="hidden" name="passAdminApply" value="false">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn--sm" type="submit">忽略</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${#lists.isEmpty(adminApplies)}" style="border:0">暂时没有人申请</div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
