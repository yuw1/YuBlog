<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('首页')}"></head>
<body>
<div th:replace="~{fragments :: topbar('home')}"></div>

<section class="hero">
    <div class="hero__orb hero__orb--a"></div>
    <div class="hero__orb hero__orb--b"></div>
    <div class="shell">
        <span class="hero__eyebrow">
            <span class="hero__dot"></span>
            个人博客 · 写代码也写字
        </span>
        <h1 class="gradient-text" th:text="${blogSlogen}">技术分享博客</h1>
        <p class="hero__sub" th:text="${blogMinorSlogen}">知识改变生活</p>
        <div class="hero__actions">
            <a class="btn btn--primary" href="/blog">
                浏览全部文章
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M13 6l6 6-6 6"/>
                </svg>
            </a>
            <a class="btn" href="/write-article">写一篇文章</a>
        </div>
    </div>
</section>

<main class="shell">
    <div class="section-title">
        <h2>最新文章</h2>
        <span th:text="${#lists.size(articles)} + ' 篇'">0 篇</span>
    </div>

    <div class="posts">
        <a class="post" th:each="article : ${articles}"
           th:href="@{/article(articleId=${article.id})}">
            <h3 class="post__title" th:text="${article.title}">标题</h3>
            <div class="post__meta">
                <span class="badge badge--accent" th:text="${article.catalogName}">分类</span>
                <span th:text="${article.authorUsername}">作者</span>
                <span class="mono" th:text="${article.lastModifiedText}">2026-01-01 00:00</span>
            </div>
            <p class="post__excerpt" th:if="${article.articleAbstract != null and !article.articleAbstract.isEmpty()}"
               th:text="${article.articleAbstract}">摘要</p>
            <span class="post__arrow">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M13 6l6 6-6 6"/>
                </svg>
            </span>
        </a>

        <div class="empty" th:if="${#lists.isEmpty(articles)}">
            <strong>这里还空着</strong>
            <span>写下第一篇文章，或者换个分类看看。</span>
        </div>
    </div>

    <div class="divider"></div>
    <div class="section-title">
        <h2>关于这个站</h2>
    </div>
    <p class="soft" style="max-width:70ch">
        2018 年用 Spring + Spring MVC + MyBatis 写的博客系统，2026 年迁到了 Spring Boot 3。
        上面每一篇文章都存在自己的 MySQL 表里，没有用任何现成的建站工具。
    </p>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
