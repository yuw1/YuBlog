<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('登录')}"></head>
<body>
<div class="auth">
    <section class="auth__art">
        <a class="brand" href="/">
            <span class="brand__mark">Y</span>
            <span class="brand__text" th:text="${blogName}">YuBlog</span>
        </a>

        <div>
            <h1 th:text="${blogLoginSlogen}">博客登录</h1>
            <p th:text="${blogLoginMinorSlogen}">知识改变生活</p>
            <p th:text="${blogLoginSencondMinorSlogen}">用交流促进技术</p>
            <div class="auth__art-meta">
                <span class="badge">Spring Boot 3</span>
                <span class="badge">MyBatis</span>
                <span class="badge">2018 → 2026</span>
            </div>
        </div>

        <p class="mono dim">© <span th:text="${year}">2026</span> Yu Wang</p>
    </section>

    <section class="auth__form">
        <button type="button" class="btn btn--icon btn--ghost" data-theme-toggle
                style="position:absolute;right:20px;top:20px" aria-label="切换主题">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
            </svg>
        </button>

        <div class="auth__box">
            <h2 class="auth__title">登录</h2>
            <p class="auth__hint">用用户名和密码进入博客。</p>

            <div class="alert alert--error" th:if="${error != null}" th:text="${error}">用户名或密码错误</div>
            <div class="alert alert--ok" th:if="${msg != null}" style="margin-top:10px" th:text="${msg}"></div>

            <form method="post" action="/login" class="form-grid" style="margin-top:18px">
                <div class="field">
                    <label for="user-name">用户名</label>
                    <input class="input" id="user-name" name="user-name" autocomplete="username"
                           required autofocus>
                </div>
                <div class="field">
                    <label for="pwd">密码</label>
                    <input class="input" type="password" id="pwd" name="pwd"
                           autocomplete="current-password" required>
                </div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn--primary" type="submit">登录</button>
            </form>

            <div class="auth__foot">
                还没有账号？<a href="/register">注册一个</a>
            </div>
        </div>
    </section>
</div>
<script src="/js/yublog.js"></script>
</body>
</html>
