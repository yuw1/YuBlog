spring:
  datasource:
    url: jdbc:h2:mem:yublog-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  thymeleaf:
    cache: false

yublog:
  upload-dir: target/test-avatars

logging:
  level:
    root: WARN
    cn.net.wangshifu: INFO