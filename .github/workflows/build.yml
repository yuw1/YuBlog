name: build

on:
  push:
    branches: [ master, 'modernize/**' ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yublog-jar
          path: target/*.jar
          retention-days: 7